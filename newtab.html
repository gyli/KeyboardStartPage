<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <script src="src/boot.js"></script>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/newtab.css">
  <script type="module" src="src/newtab.js"></script>
</head>
<body>
  <main>
    <div id="keyboard" class="keyboard" aria-label="Keyboard shortcuts"></div>
  </main>

  <footer class="footer">
    <p id="hint" class="hint" hidden>
      Press a key to open its site. Click an empty key to add one.
      <span id="focus-hint">If keys don't respond, press <kbd>Tab</kbd> first.</span>
    </p>
    <button id="open-settings" class="icon-button" type="button" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
    </button>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="editor" class="dialog">
    <form method="dialog">
      <h2>Link for <kbd id="editor-key"></kbd></h2>
      <label for="editor-url">Website address</label>
      <input id="editor-url" type="text" inputmode="url" placeholder="example.com" autocomplete="off" spellcheck="false">
      <p id="editor-error" class="error" role="alert"></p>
      <div class="dialog-actions">
        <button id="editor-remove" class="button danger" type="button">Remove</button>
        <span class="spacer"></span>
        <button class="button" value="cancel" formnovalidate>Cancel</button>
        <button class="button primary" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <template id="key-template">
    <div class="key">
      <a class="key-cap">
        <span class="key-label"></span>
        <img class="key-icon" alt="" hidden>
        <span class="key-site"></span>
      </a>
      <button class="key-edit" type="button" tabindex="-1" aria-label="Edit link">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg>
      </button>
    </div>
  </template>
</body>
</html>
