<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keyboard Start Page Settings</title>
  <script src="src/boot.js"></script>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/options.css">
  <script type="module" src="src/options.js"></script>
</head>
<body>
  <header class="page-header">
    <img src="icons/icon-128.png" alt="" width="40" height="40">
    <div>
      <h1>Keyboard Start Page</h1>
      <p>Changes are saved automatically.</p>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Appearance</h2>
      <div class="field">
        <span class="field-label" id="theme-label">Theme</span>
        <div class="segmented" role="radiogroup" aria-labelledby="theme-label">
          <label><input type="radio" name="theme" value="system"> System</label>
          <label><input type="radio" name="theme" value="light"> Light</label>
          <label><input type="radio" name="theme" value="dark"> Dark</label>
        </div>
      </div>
      <div class="field">
        <label class="field-label" for="bg-color">Background</label>
        <div class="inline">
          <input id="bg-color" type="color">
          <button id="bg-reset" class="button" type="button">Use theme color</button>
        </div>
      </div>
      <label class="field toggle">
        <span>
          <span class="field-label">Show hints</span>
          <span class="description">Show a short help line under the keyboard.</span>
        </span>
        <input id="show-hints" type="checkbox" role="switch">
      </label>
    </section>

    <section class="card">
      <h2>Behavior</h2>
      <label class="field toggle">
        <span>
          <span class="field-label">Focus the page on new tabs</span>
          <span class="description">Chrome puts the cursor in the address bar on every new tab, so keys don't work until you press Tab or click the page. Turn this on to focus the page instead. The address bar will then show the extension's address.</span>
        </span>
        <input id="focus-page" type="checkbox" role="switch">
      </label>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>Opening links</h2>
        <button id="shortcuts-reset" class="button" type="button">Reset to defaults</button>
      </div>
      <div id="shortcuts" class="shortcuts"></div>
    </section>

    <section class="card">
      <h2>Your links</h2>
      <p class="description">To add or change a link, open a new tab and click a key.</p>
      <ul id="links" class="links"></ul>
    </section>

    <section class="card">
      <h2>Backup</h2>
      <p class="description">Save your links and settings to a file, or restore them from one. Restoring replaces everything.</p>
      <div class="inline">
        <button id="export" class="button" type="button">Export</button>
        <button id="import-button" class="button" type="button">Import</button>
        <input id="import" type="file" accept="application/json,.json" hidden>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
